version: '3.8'


# PostgreSQL
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ERP_PropertyDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrongPassword123!

    ports:
    - "5432:5432"    

# Property Management API
  poperty-management-api:
    image: poperty-management-api
    build:
      context: .
      dockerfile: src/Services/PropertyManagement/PropertyManagement.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ERP_PropertyDB;Username=postgres;Password=YourStrongPassword123!"
    
    ports:
    - "5141:8080"

# Assets Management API
  assets-management-api:
    image: assets-management-api
    build:
      context: .
      dockerfile: src/Services/AssetsManagement/AssetsManagement.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ERP_PropertyDB;Username=postgres;Password=YourStrongPassword123!"

    ports:
    - "5139:8080"


# YARP API Gateway
  yarpapigateway:
    image: api-gateway
    build:
      context: .
      dockerfile: src/ApiGateway/YarpApiGateway/Dockerfile
      
    environment:
      ASPNETCORE_ENVIRONMENT: Development    
    ports:
      - "5000:8080"
