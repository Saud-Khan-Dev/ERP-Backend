

# PostgreSQL
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ERP_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrongPassword123!

    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
    - "5432:5432"

# Property Management API
  poperty-management-api:
    image: poperty-management-api
    build:
      context: ./src
      dockerfile: Services/PropertyManagement/PropertyManagement.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ERP_DB;Username=postgres;Password=YourStrongPassword123!"
      # must match the Identity service; override in any environment that is not a developer machine
      Jwt__SigningKey: "dev-only-signing-key-change-me-at-least-32-bytes-long"
      # the GDA file server; mounted below so uploaded documents survive a container rebuild
      FileStorage__RootPath: "/data/property-files"

    volumes:
      - property-files:/data/property-files

    depends_on:
      - postgres

    ports:
    - "5141:8080"

# Assets Management API
  assets-management-api:
    image: assets-management-api
    build:
      context: ./src
      dockerfile: Services/AssetsManagement/AssetsManagement.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ERP_DB;Username=postgres;Password=YourStrongPassword123!"
      # documents and photos of assets (invoices, warranty cards, pictures)
      FileStorage__RootPath: "/data/asset-files"

    volumes:
      - asset-files:/data/asset-files

    depends_on:
      - postgres

    ports:
    - "5139:8080"


# HRM API (employees, posts, attendance, leave, performance, payroll, employee portal)
  hrm-api:
    image: hrm-api
    build:
      context: ./src
      dockerfile: Services/HRM/HRM.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # employee documents, certificates and photos; mounted below so they survive a container rebuild
      FileStorage__RootPath: "/data/hrm-files"
      # dev only: lets one person prepare and approve a payroll run. Leave it on (the default) anywhere real.
      Payroll__RequireSeparateApprover: "false"
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ERP_DB;Username=postgres;Password=YourStrongPassword123!"
      # must match the Identity service; override in any environment that is not a developer machine
      Jwt__SigningKey: "dev-only-signing-key-change-me-at-least-32-bytes-long"

    volumes:
      - hrm-files:/data/hrm-files

    depends_on:
      - postgres

    ports:
    - "5144:8080"


# Identity (authentication & authorization)
  identity-api:
    image: identity-api
    build:
      context: ./src
      dockerfile: Services/Identity/Identity.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: "Host=postgres;Port=5432;Database=ERP_DB;Username=postgres;Password=YourStrongPassword123!"
      # override these in any environment that is not a developer machine
      Jwt__SigningKey: "dev-only-signing-key-change-me-at-least-32-bytes-long"

    depends_on:
      - postgres

    ports:
    - "5142:8080"


# YARP API Gateway
  yarpapigateway:
    image: api-gateway
    build:
      context: ./src
      dockerfile: ApiGateway/YarpApiGateway/Dockerfile
      
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # inside the compose network the services are reached by container name, not localhost
      ReverseProxy__Clusters__property-management-cluster__Destinations__property-management-api__Address: "http://poperty-management-api:8080"
      ReverseProxy__Clusters__assets-management-cluster__Destinations__assets-management-api__Address: "http://assets-management-api:8080"
      ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address: "http://identity-api:8080"
      ReverseProxy__Clusters__hrm-cluster__Destinations__hrm-api__Address: "http://hrm-api:8080"
    depends_on:
      - poperty-management-api
      - assets-management-api
      - identity-api
      - hrm-api
    ports:
      - "5000:8080"

volumes:
  pgdata:
  property-files:
  asset-files:
  hrm-files:
